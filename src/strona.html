<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Jezyk francuski</title>
    <link rel="stylesheet" href="style.css">
<style>
    .form-line 
    {
        display: flex;
        align-items: center;
        gap: 35px;
        margin-top: 150px;
        margin-left: 550px;
    }
    
    label
    {
        
        font-size: 20px;
        font-weight: bold;
    }


    {
        width: 400px;
        height: 50px;
        font-size: 16px;
    }
    input 
    {
        
        padding: 10px;
        font-size: 16px;
        cursor: pointer;
    }

    button
    {
        padding: 10px;
        font-size: 20px;
        cursor: pointer;
        background-color: #42bfbd;
        width: 150px;
    }
    .bottom-box
    {
        position: fixed;
        bottom: 200px;
        left: 50%;
        transform: translateX(-50%);
        background-color: #f2f2f2;
        padding: 30px;
        text-align: center;
        max-width: 850px;
        width: 80%;
        height: 100px;
        padding-bottom: 50px;
    }
    </style>
<head>
<body>
    <h1 style="margin-top: 100px; text-align: center;">Tłumacz na j.francuski</h1>

    <form class="form-line">
        <label for="polish-word">Wpisz rzeczownik po polsku</label>
        <input type="text" id="tekst" name="polish-word" placeholder>
        <button type="submit">Przetłumacz</button>
    <div class="bottom-box">
        <p style="font-size: 40px; color: #ffa1a9; font-weight: bold;">bagnole</p>
    </div>
</form>
</body>
</html>
